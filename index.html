cluded, then you compare.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 2, softer version. Customer: “É muito caro.”","type":"sentence","audio":true},{"id":"ob-3-r","unit":12,"lesson":"ob34","pt":"Perfeito, e a gente adora trabalhar com contadores. Ele usa algum sistema específico?","en":"Perfect, and we love working with accountants. Does he use a specific system?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 3, natural response (use this first). Customer: “Meu contador cuida de tudo.”","type":"sentence","audio":true},{"id":"ob-3-f","unit":12,"lesson":"ob34","pt":"Você tem acesso às informações quando precisa?","en":"Do you have access to the information when you need it?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 3, follow-up question. Customer: “Meu contador cuida de tudo.”","type":"sentence","dict":true,"audio":true},{"id":"ob-3-st","unit":12,"lesson":"ob34","pt":"Que tal a gente marcar uma conversa rapidinha com ele? Muitos contadores gostam de ter tudo num só lugar.","en":"How about we set up a quick conversation with him? Many accountants like having everything in one place.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 3, stronger version (only after you acknowledged and diagnosed). Customer: “Meu contador cuida de tudo.”","type":"sentence","audio":true},{"id":"ob-3-so","unit":12,"lesson":"ob34","pt":"Sem problema nenhum. Posso mandar um material pra você repassar pra ele?","en":"No problem at all. Can I send some material for you to pass along to him?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 3, softer version. Customer: “Meu contador cuida de tudo.”","type":"sentence","audio":true},{"id":"ob-4-r","unit":12,"lesson":"ob34","pt":"Muitos dos nossos clientes começam bem pequenos, com poucos funcionários.","en":"Many of our clients start out very small, with few employees.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 4, natural response (use this first). Customer: “Somos pequenos demais.”","type":"sentence","audio":true},{"id":"ob-4-f","unit":12,"lesson":"ob34","pt":"Quanto tempo você gasta com a folha hoje?","en":"How much time do you spend on payroll today?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 4, follow-up question. Customer: “Somos pequenos demais.”","type":"sentence","dict":true,"audio":true},{"id":"ob-4-st","unit":12,"lesson":"ob34","pt":"Justamente por ser pequeno, cada hora conta. Se a gente economizar tempo, vale a pena.","en":"Precisely because you’re small, every hour counts. If we save time, it’s worth it.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 4, stronger version (only after you acknowledged and diagnosed). Customer: “Somos pequenos demais.”","type":"sentence","audio":true},{"id":"ob-4-so","unit":12,"lesson":"ob34","pt":"Entendo. Quando a empresa crescer, vai ser mais fácil já ter um sistema pronto.","en":"I understand. When the company grows, it’ll be easier to already have a system in place.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 4, softer version. Customer: “Somos pequenos demais.”","type":"sentence","audio":true},{"id":"ob-5-r","unit":12,"lesson":"ob56","pt":"Sem problema, eu sei que você está corrido. Qual o melhor horário pra eu te ligar: amanhã de manhã ou à tarde?","en":"No problem, I know you’re busy. What’s the best time for me to call you: tomorrow morning or afternoon?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 5, natural response (use this first). Customer: “Não tenho tempo agora.”","type":"sentence","audio":true},{"id":"ob-5-st","unit":12,"lesson":"ob56","pt":"Só preciso de dois minutos. Posso te fazer duas perguntas rápidas agora?","en":"I only need two minutes. Can I ask you two quick questions now?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 5, stronger version (only after you acknowledged and diagnosed). Customer: “Não tenho tempo agora.”","type":"sentence","audio":true},{"id":"ob-5-so","unit":12,"lesson":"ob56","pt":"Claro! Vou deixar meu contato e você me chama quando puder.","en":"Of course! I’ll leave my contact and you reach out when you can.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 5, softer version. Customer: “Não tenho tempo agora.”","type":"sentence","audio":true},{"id":"ob-6-r","unit":12,"lesson":"ob56","pt":"Claro! Que dia e horário ficam melhor?","en":"Of course! What day and time work best?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 6, natural response (use this first). Customer: “Me liga depois.”","type":"sentence","dict":true,"audio":true},{"id":"ob-6-st","unit":12,"lesson":"ob56","pt":"Perfeito. Fechado amanhã às 10h, pode ser? Já deixo marcado.","en":"Perfect. Tomorrow at 10, does that work? I’ll put it on the calendar now.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 6, stronger version (only after you acknowledged and diagnosed). Customer: “Me liga depois.”","type":"sentence","audio":true},{"id":"ob-6-so","unit":12,"lesson":"ob56","pt":"Sem pressa. Te ligo na semana que vem.","en":"No rush. I’ll call you next week.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 6, softer version. Customer: “Me liga depois.”","type":"sentence","dict":true,"audio":true},{"id":"ob-7-r","unit":12,"lesson":"ob78","pt":"Claro, é uma decisão importante. O que exatamente você gostaria de pensar?","en":"Of course, it’s an important decision. What exactly would you like to think about?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 7, natural response (use this first). Customer: “Preciso pensar.”","type":"sentence","audio":true},{"id":"ob-7-f","unit":12,"lesson":"ob78","pt":"É o valor, o serviço, ou outra coisa?","en":"Is it the price, the service, or something else?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 7, follow-up question. Customer: “Preciso pensar.”","type":"sentence","dict":true,"audio":true},{"id":"ob-7-st","unit":12,"lesson":"ob78","pt":"Se a gente resolver essa dúvida agora, você se sente confortável em avançar?","en":"If we resolve that question now, do you feel comfortable moving forward?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 7, stronger version (only after you acknowledged and diagnosed). Customer: “Preciso pensar.”","type":"sentence","audio":true},{"id":"ob-7-so","unit":12,"lesson":"ob78","pt":"Sem pressa nenhuma. Quando você acha que consegue me dar uma resposta?","en":"No rush at all. When do you think you can give me an answer?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 7, softer version. Customer: “Preciso pensar.”","type":"sentence","audio":true},{"id":"ob-8-r","unit":12,"lesson":"ob78","pt":"Faz sentido. Ele está disponível? A gente pode fazer uma chamada rápida os três juntos.","en":"That makes sense. Is he available? We can do a quick call, the three of us together.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 8, natural response (use this first). Customer: “Preciso falar com meu sócio.”","type":"sentence","audio":true},{"id":"ob-8-f","unit":12,"lesson":"ob78","pt":"O que você acha que ele vai querer saber?","en":"What do you think he’ll want to know?","alts":[ ":["objection_sequencing"],"note":"Objection 9, stronger version (only after you acknowledged and diagnosed). Customer: “Não precisamos de nada.”","type":"sentence","audio":true},{"id":"ob-9-so","unit":12,"lesson":"ob910","pt":"Tudo bem. Se um dia mudar, você tem meu contato.","en":"All right. If that ever changes, you have my contact.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 9, softer version. Customer: “Não precisamos de nada.”","type":"sentence","audio":true},{"id":"ob-10-r","unit":12,"lesson":"ob910","pt":"Qual vocês usam?","en":"Which one do you use?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 10, natural response (use this first). Customer: “Já usamos outra empresa de folha.”","type":"chunk","dict":true,"audio":true},{"id":"ob-10-f","unit":12,"lesson":"ob910","pt":"O que você mais gosta e o que você mudaria?","en":"What do you like most and what would you change?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 10, follow-up question. Customer: “Já usamos outra empresa de folha.”","type":"sentence","audio":true},{"id":"ob-10-st","unit":12,"lesson":"ob910","pt":"Posso fazer uma comparação rápida, sem compromisso. Se não for melhor, você continua onde está.","en":"I can do a quick comparison, no commitment. If it isn’t better, you stay where you are.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 10, stronger version (only after you acknowledged and diagnosed). Customer: “Já usamos outra empresa de folha.”","type":"sentence","audio":true},{"id":"ob-10-so","unit":12,"lesson":"ob910","pt":"Ótimo. Só queria me apresentar caso um dia você queira comparar.","en":"Great. I just wanted to introduce myself in case you ever want to compare.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 10, softer version. Customer: “Já usamos outra empresa de folha.”","type":"sentence","audio":true},{"id":"ob-11-r","unit":12,"lesson":"ob1112","pt":"Claro! Pra eu mandar o que realmente interessa, posso fazer duas perguntas rápidas?","en":"Of course! So I send what’s actually relevant, can I ask two quick questions?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 11, natural response (use this first). Customer: “Me manda informação.”","type":"sentence","audio":true},{"id":"ob-11-f","unit":12,"lesson":"ob1112","pt":"Quantos funcionários você tem e como você faz a folha hoje?","en":"How many employees do you have and how do you do payroll today?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 11, follow-up question. Customer: “Me manda informação.”","type":"sentence","audio":true},{"id":"ob-11-st","unit":12,"lesson":"ob1112","pt":"Mando hoje. E já deixo uma conversa de dez minutos marcada pra gente rever junto, pode ser quinta?","en":"I’ll send it today. And I’ll book a ten-minute conversation for us to review it together, does Thursday work?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 11, stronger version (only after you acknowledged and diagnosed). Customer: “Me manda informação.”","type":"sentence","audio":true},{"id":"ob-11-so","unit":12,"lesson":"ob1112","pt":"Mando agora. Qualquer dúvida, é só me chamar.","en":"I’ll send it now. Any questions, just reach out.","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_sequencing"],"note":"Objection 11, softer version. Customer: “Me manda informação.”","type":"sentence","dict":true,"audio":true},{"id":"ob-12-r","unit":12,"lesson":"ob1112","pt":"Entendo a preocupação. O que exatamente te preocupa no contrato?","en":"I understand the concern. What exactly worries you about the contract?","alts":[],"badge":"","tags":["objection"],"errorClasses":["objection_s o":true},{"id":"rp-1","unit":15,"lesson":"rpA","pt":"Aqui é o Kyle, da ADP. Eu liguei meio de surpresa, então vou ser rápido.","en":"Reply to: “Who are you? (cold call)”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":[],"note":"Name, company and reason in one breath, then ask for two minutes.","type":"reply","reply":{"c":"Quem é você?","cen":"Who are you? (cold call)"},"m":["Eu sou o Kyle, da ADP.","Aqui é o Kyle, da ADP. Eu liguei meio de surpresa, então vou ser rápido.","Aqui é o Kyle, da ADP. Eu trabalho com empresas aqui na região pra simplificar a folha de pagamento. Você tem dois minutinhos pra eu te fazer umas perguntas?"],"audio":true},{"id":"rp-2","unit":15,"lesson":"rpA","pt":"Sem problema, vou ser rápido. Quem cuida da folha de pagamento hoje?","en":"Reply to: “I’m in the middle of a job, talk fast.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Respect the time. One question, or two-choice reschedule.","type":"reply","reply":{"c":"Estou no meio de uma obra, fala rápido.","cen":"I’m in the middle of a job, talk fast."},"m":["Sem problema, vou ser rápido.","Sem problema, vou ser rápido. Quem cuida da folha de pagamento hoje?","Sem problema! Uma pergunta só: como vocês acompanham as horas dos funcionários em cada obra hoje? Se fizer sentido, eu te ligo num horário melhor."],"audio":true},{"id":"rp-3","unit":15,"lesson":"rpA","pt":"Que bom! É um contador ou outra empresa?","en":"Reply to: “I already have someone who does that.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Acknowledge, then find out who and what they would change.","type":"reply","reply":{"c":"Já tenho alguém que faz isso.","cen":"I already have someone who does that."},"m":["Entendi. Quem cuida da folha hoje?","Que bom! É um contador ou outra empresa?","Ótimo, isso é bom de ouvir. O que você mais gosta no serviço, e se pudesse mudar uma coisa, o que seria?"],"audio":true},{"id":"rp-4","unit":15,"lesson":"rpA","pt":"Boa pergunta. O valor depende do pacote e do número de funcionários. Quantos funcionários vocês têm hoje?","en":"Reply to: “How much does it cost? (too early)”","alts":[],"badge":"VERIFY","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Don’t quote a number yet. Promise a straight answer and earn two questions.","type":"reply","reply":{"c":"Quanto custa?","cen":"How much does it cost? (too early)"},"m":["O valor depende do número de funcionários.","Boa pergunta. O valor depende do pacote e do número de funcionários. Quantos funcionários vocês têm hoje?","Eu te passo o valor certinho. Pra isso, posso te fazer duas perguntas rápidas? Quantos funcionários vocês têm e como vocês fazem a folha hoje?"],"audio":true},{"id":"rp-5","unit":15,"lesson":"rpA","pt":"Perfeito. Muitos dos nossos clientes começam bem pequenos. Quanto tempo você gasta com a folha hoje?","en":"Reply to: “We only have five employees.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Small is normal. Move to time spent.","type":"reply","reply":{"c":"Temos só cinco funcionários.","cen":"We only have five employees."},"m":["Muitos dos nossos clientes têm poucos funcionários.","Perfeito. Muitos dos nossos clientes começam bem pequenos. Quanto tempo você gasta com a folha hoje?","Justamente por ser pequeno, cada hora conta. Quem faz a folha desses cinco hoje, é você mesmo?"],"audio":true},{"id":"rp-6","unit":15,"lesson":"rpA","pt":"Entendi. E quanto tempo você gasta com isso por semana?","en":"Reply to: “I do everything on paper anyway.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"No judgment. Ask about time and errors.","type":"reply","reply":{"c":"Faz tudo no papel mesmo.","cen":"I do everything on paper anyway."},"m":["Entendi. Quanto tempo isso leva por semana?","Entendi. E quanto tempo você gasta com isso por semana?","Faz sentido, muita gente começa assim. Já aconteceu algum erro ou atraso por causa do papel?"],"audio":true},{"id":"rp-7","unit":15,"lesson":"rpB","pt":"Entendi. Essa parte tem regras específicas, então o ideal é confirmar com o seu contador.","en":"Reply to: “I pay some of them in cash.”","alts":[],"badge":"VERIFY","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Compliance topic. No legal advice: route to the accountant and move on.","type":"reply","reply":{"c":"Pago em dinheiro pra alguns.","cen":"I pay some of them in cash."},"m":["Entendi. Essa parte tem regras específicas.","Entendi. Essa parte tem regras específicas, então o ideal é confirmar com o seu contador.","Entendi, obrigado por me contar. Essa parte tem regras específicas, então o ideal é confirmar com o seu contador ou advogado. O que eu posso fazer é te mostrar como a folha fica organizada no sistema. Quantos funcionários vocês têm no total?"],"audio":true},{"id":"rp-8","unit":15,"lesson":"rpB","pt":"Entendi, dezoito funcionários. E quantos contratados 1099 vocês têm?","en":"Reply to: “I have 18 employees and several 1099s.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Repeat the number back, then dig into the 1099s and pay frequency.","type":"reply","reply":{"c":"Tenho 18 funcionários e vários 1099.","cen":"I have 18 employees and several 1099s."},"m":["Entendi. Quantos contratados 1099 vocês têm?","Entendi, dezoito funcionários. E quantos contratados 1099 vocês têm?","Entendi: dezoito W-2 e vários 1099. Com que frequência vocês pagam, e quem cuida disso hoje?"],"audio":true},{"id":"rp-9","unit":15,"lesson":"rpB","pt":"Nossa, quase um dia. O que é mais trabalhoso nesse processo?","en":"Reply to: “Payroll takes me almost a whole day.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"That is the pain. Acknowledge it, then ask what takes the longest.","type":"reply","reply":{"c":"A folha leva quase um dia pra mim.","cen":"Payroll takes me almost a whole day."},"m":["Entendi. É muito tempo.","Nossa, quase um dia. O que é mais trabalhoso nesse processo?","Quase um dia inteiro, entendi. É justamente aí que a gente pode ajudar. O que toma mais tempo: as horas, os cálculos ou os impostos?"],"audio":true},{"id":"rp-10","unit":15,"lesson":"rpB","pt":"Entendi. Na RUN, os funcionários acessam os próprios contracheques pelo portal, sem precisar te pedir.","en":"Reply to: “Employees are always asking me for proof of income.”","alts":[],"badge":"NATIVE","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Employee self-service is native. State it plainly and ask how often.","type":"reply","reply":{"c":"Os funcionários sempre me pedem comprovante.","cen":"Employees are always asking me for proof of income."},"m":["Os funcionários podem acessar os contracheques pelo portal.","Entendi. Na RUN, os funcionários acessam os próprios contracheques pelo portal, sem precisar te pedir.","Entendi. Quantas vezes por mês alguém te pede isso? Na RUN, eles acessam os próprios contracheques e documentos de imposto pelo portal."],"audio":true},{"id":"rp-11","unit":15,"lesson":"rpB","pt":"Imagino. Como vocês registram quem entra novo hoje?","en":"Reply to: “Turnover here is extremely high.”","alts":[],"badge":"PACKAGE","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Restaurant pain. Ask how new people are registered before pitching.","type":"reply","reply":{"c":"A rotatividade aqui é altíssima.","cen":"Turnover here is extremely high."},"m":["Entendi. Como vocês contratam hoje?","Imagino. Como vocês registram quem entra novo hoje?","Imagino, restaurante é assim mesmo. Se o novo funcionário preenchesse a papelada online, isso ajudaria com a rotatividade?"],"audio":true},{"id":"rp-12","unit":15,"lesson":"rpB","pt":"Entendi. E quanto tempo você leva pra passar as horas da planilha pra folha?","en":"Reply to: “I track hours in a spreadsheet.”","alts":[],"badge":"PACKAGE","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Ask about time and errors. Time tracking is an add-on.","type":"reply","reply":{"c":"Controlo as horas numa planilha.","cen":"I track hours in a spreadsheet."},"m":["Entendi. Quanto tempo isso leva?","Entendi. E quanto tempo você leva pra passar as horas da planilha pra folha?","Entendi. Já aconteceu algum erro passando as horas da planilha pra folha? Existe um módulo adicional de controle de horas que se conecta com a folha."],"audio":true},{"id":"rp-13","unit":15,"lesson":"rpC","pt":"Faz sentido. Como vocês acompanham o custo de mão de obra em cada obra hoje?","en":"Reply to: “I need to know how much each job costs.”","alts":[],"badge":"PACKAGE","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Job Costing depends on the package. Ask how they track it today.","type":"reply","reply":{"c":"Preciso saber quanto cada obra custa.","cen":"I need to know how much each job costs."},"m":["Entendi. Como vocês acompanham isso hoje?","Faz sentido. Como vocês acompanham o custo de mão de obra em cada obra hoje?","É justamente aí que o controle de custos por projeto pode ajudar. Os funcionários trabalham em mais de uma obra na mesma semana?"],"audio":true},{"id":"rp-14","unit":15,"lesson":"rpC","pt":"Dá pra enviar os dados da folha pra programas de contabilidade compatíveis. Deixa eu confirmar a integração exata com o QuickBooks.","en":"Reply to: “Does this work with QuickBooks?”","alts":[],"badge":"VERIFY","tags":["roleplay"],"errorClasses":[],"note":"Verify and answer honestly. Never promise an exact integration.","type":"reply","reply":{"c":"Isso funciona com QuickBooks?","cen":"Does this work with QuickBooks?"},"m":["Deixa eu confirmar esse detalhe.","Dá pra enviar os dados da folha pra programas de contabilidade compatíveis. Deixa eu confirmar a integração exata com o QuickBooks.","Boa pergunta. Existe envio dos dados da folha pra programas compatíveis, mas deixa eu confirmar esse detalhe pra te passar a informação certa. Qual versão do QuickBooks vocês usam?"],"audio":true},{"id":"rp-15","unit":15,"lesson":"rpC","pt":"Tem, sim. Existe aplicativo pra acompanhar e fazer tarefas básicas pelo celular.","en":"Reply to: “Do you have an app?”","alts":[],"badge":"VERIFY","tags":["roleplay"],"errorClasses":[],"note":"Yes, but confirm what each user type can do.","type":"reply","reply":{"c":"Você tem aplicativo?","cen":"Do you have an app?"},"m":["Tem aplicativo, sim.","Tem, sim. Existe aplicativo pra acompanhar e fazer tarefas básicas pelo celular.","Tem, sim. Você precisa acessar a folha quando está fora do escritório? Eu confirmo exatamente o que dá pra fazer pelo celular no seu caso."],"audio":true},{"id":"rp-16","unit":15,"lesson":"rpC","pt":"Isso depende do pacote que você escolher. Deixa eu confirmar exatamente o que está incluído.","en":"Reply to: “Is job costing already included?”","alts":[],"badge":"PACKAGE","tags":["roleplay"],"errorClasses":[],"note":"Accuracy test: it depends on the package, and deeper detail is a partner integration.","type":"reply","reply":{"c":"O job costing já vem incluso?","cen":"Is job costing already included?"},"m":["Isso depende do pacote que você escolher.","Isso depende do pacote que você escolher. Deixa eu confirmar exatamente o que está incluído.","Depende do pacote. E pra um nível maior de detalhe, existem soluções de parceiros, que não são nativas da RUN. Que tipo de relatório por obra você precisa?"],"audio":true},{"id":"rp-17","unit":15,"lesson":"rpC","pt":"Entendo, é normal. A gente adora trabalhar com contadores. Ele usa algum sistema específico?","en":"Reply to: “My accountant doesn’t like change.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Bring the accountant in. Never go around him.","type":"reply","reply":{"c":"Meu contador não gosta de mudar.","cen":"My accountant doesn’t like change."},"m":["Entendo. A gente trabalha com contadores.","Entendo, é normal. A gente adora trabalhar com contadores. Ele usa algum sistema específico?","Entendo. Que tal a gente marcar uma conversa rapidinha com ele? Muitos contadores gostam de ter tudo num só lugar."],"audio":true},{"id":"rp-18","unit":15,"lesson":"rpC","pt":"Entendo a preocupação, é super comum. O relacionamento continua sendo seu.","en":"Reply to: “Am I going to lose my client to you? (accountant)”","alts":[],"badge":"VERIFY","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Acknowledge the fear, then flip it: closer to the client.","type":"reply","reply":{"c":"Vou perder meu cliente pra vocês?","cen":"Am I going to lose my client to you? (accountant)"},"m":["Não. O relacionamento continua sendo seu.","Entendo a preocupação, é super comum. O relacionamento continua sendo seu.","Entendo a preocupação. A ideia é justamente o contrário: você fica mais próximo do cliente, porque tem acesso aos dados e consegue ajudar mais rápido. Quer ver com um cliente seu como exemplo?"],"audio":true},{"id":"rp-19","unit":15,"lesson":"rpD","pt":"Boa pergunta. Eu não quero te passar um número errado, deixa eu confirmar.","en":"Reply to: “How many accounting clients do you have?”","alts":[],"badge":"VERIFY","tags":["roleplay"],"errorClasses":[],"note":"Don’t invent a statistic. Confirm, then turn it into a question.","type":"reply","reply":{"c":"Quantos clientes de contabilidade vocês têm?","cen":"How many accounting clients do you have?"},"m":["Deixa eu confirmar esse número.","Boa pergunta. Eu não quero te passar um número errado, deixa eu confirmar.","Deixa eu confirmar esse número pra te passar a informação certa. Enquanto isso, me conta: quantos clientes com funcionários o escritório atende hoje?"],"audio":true},{"id":"rp-20","unit":15,"lesson":"rpD","pt":"Boa pergunta. Pra eu responder direito, o que é mais importante pra você: atendimento, tempo ou relatórios?","en":"Reply to: “What’s the difference between you and another company?”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Don’t feature-dump. Ask what matters, then show only that.","type":"reply","reply":{"c":"Qual a diferença de vocês pra outra empresa?","cen":"What’s the difference between you and another company?"},"m":["A gente ajuda a simplificar a folha.","Boa pergunta. Pra eu responder direito, o que é mais importante pra você: atendimento, tempo ou relatórios?","Depende do que importa pra você. O que você mais gosta na empresa atual, e o que você mudaria? Aí eu te mostro só o que faz diferença."],"audio":true},{"id":"rp-21","unit":15,"lesson":"rpD","pt":"Entendo. Caro comparado com o quê? Quanto vocês pagam hoje?","en":"Reply to: “I thought your price was high.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Acknowledge, then ask compared to what. No discount yet.","type":"reply","reply":{"c":"Achei seu preço alto.","cen":"I thought your price was high."},"m":["Entendo. Alto comparado com o quê?","Entendo. Caro comparado com o quê? Quanto vocês pagam hoje?","Entendo. O valor reflete o que está incluído: o suporte, os impostos e a tranquilidade. Além do preço, o que mais é importante pra você nessa decisão?"],"audio":true},{"id":"rp-24","unit":15,"lesson":"rpD","pt":"Faz sentido. A gente pode fazer uma chamada rápida os três juntos?","en":"Reply to: “I need to talk to my wife, she handles the finances.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Include the decision-maker. Offer a three-way call with two time choices.","type":"reply","reply":{"c":"Preciso falar com minha esposa, ela cuida do financeiro.","cen":"I need to talk to my wife, she handles the finances."},"m":["Faz sentido. Ela está disponível?","Faz sentido. A gente pode fazer uma chamada rápida os três juntos?","Claro. O que você acha que ela vai querer saber? Que tal marcar amanhã com vocês dois, assim eu respondo as dúvidas dela na hora?"],"audio":true},{"id":"rp-25","unit":15,"lesson":"rpE","pt":"Boa pergunta. Deixa eu confirmar os termos exatos pra te passar a informação certa.","en":"Reply to: “What if I want to cancel?”","alts":[],"badge":"VERIFY","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Contract terms are VERIFY. Find the real worry, then confirm.","type":"reply","reply":{"c":"E se eu quiser cancelar?","cen":"What if I want to cancel?"},"m":["Deixa eu confirmar os termos do contrato.","Boa pergunta. Deixa eu confirmar os termos exatos pra te passar a informação certa.","Entendo a preocupação. O que exatamente te preocupa: o prazo ou o cancelamento? Eu confirmo os termos e te mostro antes, sem compromisso nenhum."],"audio":true},{"id":"rp-26","unit":15,"lesson":"rpE","pt":"O cadastro leva uns quinze a vinte minutos. O prazo da primeira folha eu confirmo com você.","en":"Reply to: “How long does it take to get started?”","alts":[],"badge":"VERIFY","tags":["roleplay"],"errorClasses":[],"note":"Timelines are VERIFY. Give the setup step you control and book it.","type":"reply","reply":{"c":"Quanto tempo leva pra começar?","cen":"How long does it take to get started?"},"m":["Deixa eu confirmar o prazo.","O cadastro leva uns quinze a vinte minutos. O prazo da primeira folha eu confirmo com você.","O próximo passo é eu coletar umas informações da empresa, leva uns quinze minutos. Eu confirmo o prazo certinho com a implementação. Que dia fica melhor: quarta ou quinta?"],"audio":true},{"id":"rp-27","unit":15,"lesson":"rpE","pt":"Entendo. O que faria ser o momento certo?","en":"Reply to: “I liked it, but now isn’t the time.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Find the real obstacle and keep a dated next step.","type":"reply","reply":{"c":"Gostei, mas não é o momento.","cen":"I liked it, but now isn’t the time."},"m":["Entendo. Quando seria um bom momento?","Entendo. O que faria ser o momento certo?","Entendo, sem pressa. O que impediria a gente de começar hoje? Se for só o momento, posso te ligar na semana que vem pra gente finalizar?"],"audio":true},{"id":"rp-28","unit":15,"lesson":"rpE","pt":"Claro! Esse número é o melhor pra falar com você?","en":"Reply to: “Send it to me by text.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Say yes, earn two questions, and book the follow-up.","type":"reply","reply":{"c":"Me manda por mensagem de texto.","cen":"Send it to me by text."},"m":["Claro, mando agora.","Claro! Esse número é o melhor pra falar com você?","Mando hoje. Pra eu mandar o que realmente interessa, posso fazer duas perguntas rápidas? E já deixo uma conversa de dez minutos marcada, pode ser quinta?"],"audio":true},{"id":"rp-29","unit":15,"lesson":"rpE","pt":"O sistema calcula e desconta os impostos da folha, e a gente ajuda a reduzir o risco de erro.","en":"Reply to: “Can I trust you with taxes?”","alts":[],"badge":"NATIVE","tags":["roleplay"],"errorClasses":[],"note":"No overpromising. Reduce the risk, never eliminate it.","type":"reply","reply":{"c":"Posso confiar em vocês pra imposto?","cen":"Can I trust you with taxes?"},"m":["A gente ajuda a reduzir o risco de erro.","O sistema calcula e desconta os impostos da folha, e a gente ajuda a reduzir o risco de erro.","Os impostos da folha são calculados e descontados pelo sistema, e os pagamentos e as declarações são feitos conforme o serviço contratado. A gente ajuda a reduzir o risco de erro. Quem cuida dos impostos da folha hoje?"],"audio":true},{"id":"rp-30","unit":15,"lesson":"rpE","pt":"Parabéns pela decisão! O próximo passo é eu coletar umas informações da empresa.","en":"Reply to: “OK, let’s do it.”","alts":[],"badge":"","tags":["roleplay"],"errorClasses":["objection_sequencing"],"note":"Stop selling. Congratulate and start onboarding.","type":"reply","reply":{"c":"Ok, vamos fazer.","cen":"OK, let’s do it."},"m":["Ótimo, então vamos começar.","Parabéns pela decisão! O próximo passo é eu coletar umas informações da empresa.","Parabéns pela decisão! Agora vou precisar de algumas informações pra configurar tudo, leva uns quinze a vinte minutos. Você tem o número do EIN?"],"audio":true}],"objections":[{"n":1,"c":"Estamos satisfeitos com a empresa atual.","meaning":"We’re happy with our current company.","r":"Ótimo, isso é bom de ouvir! O que você mais gosta no serviço de vocês?","ren":"Great, that’s good to hear! What do you like most about your service?","f":"Se pudesse mudar uma coisa, o que seria?","fen":"If you could change one thing, what would it be?","st":"Entendo. Mas muita gente que estava satisfeita descobriu que pagava mais do que precisava. Vale 10 minutos pra comparar?","sten":"I understand. But a lot of people who were satisfied found out they were paying more than they needed to. Is it worth 10 minutes to compare?","so":"Sem intenção de trocar nada. Só queria deixar uma opção pra você caso um dia precise.","soen":"No intention of switching anything. I just wanted to leave you an option in case you ever need it.","badge":"","note":""},{"n":2,"c":"É muito caro.","meaning":"It’s too expensive.","r":"Entendo. Caro comparado com o quê?","ren":"I understand. Expensive compared to what?","f":"Quanto você paga hoje?","fen":"How much do you pay today?","st":"Se eu conseguir ficar no mesmo valor ou menos, você avança?","sten":"If I can stay at the same price or less, do you move forward?","so":"Faz sentido olhar o valor. Deixa eu te mostrar tudo o que está incluído, aí você compara.","soen":"It makes sense to look at the price. Let me show you everything that’s included, then you compare.","badge":"VERIFY","note":""},{"n":3,"c":"Meu contador cuida de tudo.","meaning":"My accountant handles everything.","r":"Perfeito, e a gente adora trabalhar com contadores. Ele usa algum sistema específico?","ren":"Perfect, and we love working with accountants. Does he use a specific system?","f":"Você tem acesso às informações quando precisa?","fen":"Do you have access to the information when you need it?","st":"Que tal a gente marcar uma conversa rapidinha com ele? Muitos contadores gostam de ter tudo num só lugar.","sten":"How about we set up a quick conversation with him? Many accountants like having everything in one place.","so":"Sem problema nenhum. Posso mandar um material pra você repassar pra ele?","soen":"No problem at all. Can I send some material for you to pass along to him?","badge":"","note":""},{"n":4,"c":"Somos pequenos demais.","meaning":"We’re too small.","r":"Muitos dos nossos clientes começam bem pequenos, com poucos funcionários.","ren":"Many of our clients start out very small, with few employees.","f":"Quanto tempo você gasta com a folha hoje?","fen":"How much time do you spend on payroll today?","st":"Justamente por ser pequeno, cada hora conta. Se a gente economizar tempo, vale a pena.","sten":"Precisely because you’re small, every hour counts. If we save time, it’s worth it.","so":"Entendo. Quando a empresa crescer, vai ser mais fácil já ter um sistema pronto.","soen":"I understand. When the company grows, it’ll be easier to already have a system in place.","badge":"","note":""},{"n":5,"c":"Não tenho tempo agora.","meaning":"I don’t have time right now.","r":"Sem problema, eu sei que você está corrido. Qual o melhor horário pra eu te ligar: amanhã de manhã ou à tarde?","ren":"No problem, I know you’re busy. What’s the best time for me to call you: tomorrow morning or afternoon?","f":"Posso te mandar uma mensagem pra confirmar?","fen":"Can I send you a message to confirm?","st":"Só preciso de dois minutos. Posso te fazer duas perguntas rápidas agora?","sten":"I only need two minutes. Can I ask you two quick questions now?","so":"Claro! Vou deixar meu contato e você me chama quando puder.","soen":"Of course! I’ll leave my contact and you reach out when you can.","badge":"","note":""},{"n":6,"c":"Me liga depois.","meaning":"Call me later.","r":"Claro! Que dia e horário ficam melhor?","ren":"Of course! What day and time work best?","f":"Esse número é o melhor pra falar com você?","fen":"Is this the best number to reach you?","st":"Perfeito. Fechado amanhã às 10h, pode ser? Já deixo marcado.","sten":"Perfect. Tomorrow at 10, does that work? I’ll put it on the calendar now.","so":"Sem pressa. Te ligo na semana que vem.","soen":"No rush. I’ll call you next week.","badge":"","note":""},{"n":7,"c":"Preciso pensar.","meaning":"I need to think about it.","r":"Claro, é uma decisão importante. O que exatamente você gostaria de pensar?","ren":"Of course, it’s an important decision. What exactly would you like to think about?","f":"É o valor, o serviço, ou outra coisa?","fen":"Is it the price, the service, or something else?","st":"Se a gente resolver essa dúvida agora, você se sente confortável em avançar?","sten":"If we resolve that question now, do you feel comfortable moving forward?","so":"Sem pressa nenhuma. Quando você acha que consegue me dar uma resposta?","soen":"No rush at all. When do you think you can give me an answer?","badge":"","note":""},{"n":8,"c":"Preciso falar com meu sócio.","meaning":"I need to talk to my partner.","r":"Faz sentido. Ele está disponível? A gente pode fazer uma chamada rápida os três juntos.","ren":"That makes sense. Is he available? We can do a quick call, the three of us together.","f":"O que você acha que ele vai querer saber?","fen":"What do you think he’ll want to know?","st":"Que tal marcar amanhã com vocês dois? Assim eu respondo as dúvidas dele na hora.","sten":"How about booking tomorrow with both of you? That way I answer his questions on the spot.","so":"Claro. Posso mandar um resumo pra você mostrar pra ele?","soen":"Of course. Can I send a summary for you to show him?","badge":"","note":""},{"n":9,"c":"Não precisamos de nada.","meaning":"We don’t need anything.","r":"Entendo! Como vocês fazem a folha hoje?","ren":"I understand! How do you do payroll today?","f":"E isso funciona bem?","fen":"And does that work well?","st":"Muita gente pensa assim até ver quanto tempo dá pra economizar. Posso mostrar em cinco minutos?","sten":"A lot of people think that way until they see how much time can be saved. Can I show you in five minutes?","so":"Tudo bem. Se um dia mudar, você tem meu contato.","soen":"All right. If that ever changes, you have my contact.","badge":"","note":""},{"n":10,"c":"Já usamos outra empresa de folha.","meaning":"We already use another payroll company.","r":"Qual vocês usam?","ren":"Which one do you use?","f":"O que você mais gosta e o que você mudaria?","fen":"What do you like most and what would you change?","st":"Posso fazer uma comparação rápida, sem compromisso. Se não for melhor, você continua onde está.","sten":"I can do a quick comparison, no commitment. If it isn’t better, you stay where you are.","so":"Ótimo. Só queria me apresentar caso um dia você queira comparar.","soen":"Great. I just wanted to introduce myself in case you ever want to compare.","badge":"","note":""},{"n":11,"c":"Me manda informação.","meaning":"Send me information.","r":"Claro! Pra eu mandar o que realmente interessa, posso fazer duas perguntas rápidas?","ren":"Of course! So I send what’s actually relevant, can I ask two quick questions?","f":"Quantos funcionários você tem e como você faz a folha hoje?","fen":"How many employees do you have and how do you do payroll today?","st":"Mando hoje. E já deixo uma conversa de dez minutos marcada pra gente rever junto, pode ser quinta?","sten":"I’ll send it today. And I’ll book a ten-minute conversation for us to review it together, does Thursday work?","so":"Mando agora. Qualquer dúvida, é só me chamar.","soen":"I’ll send it now. Any questions, just reach out.","badge":"","note":""},{"n":12,"c":"Não quero assinar contrato.","meaning":"I don’t want to sign a contract.","r":"Entendo a preocupação. O que exatamente te preocupa no contrato?","ren":"I understand the concern. What exactly worries you about the contract?","f":"É o prazo, o cancelamento, ou outra coisa?","fen":"Is it the term, the cancellation, or something else?","st":"Deixa eu te explicar exatamente como funciona e você decide.","sten":"Let me explain exactly how it works and you decide.","so":"Posso te mostrar os termos antes, sem compromisso nenhum.","soen":"I can show you the terms beforehand, with no commitment at all.","badge":"VERIFY","note":"State actual contract terms only after confirming them internally."}],"roleplays":[{"n":1,"c":"Quem é você?","cen":"Who are you? (cold call)","coach":"Name, company and reason in one breath, then ask for two minutes.","m":["Eu sou o Kyle, da ADP.","Aqui é o Kyle, da ADP. Eu liguei meio de surpresa, então vou ser rápido.","Aqui é o Kyle, da ADP. Eu trabalho com empresas aqui na região pra simplificar a folha de pagamento. Você tem dois minutinhos pra eu te fazer umas perguntas?"],"w":["next"],"u":[],"badge":""},{"n":2,"c":"Estou no meio de uma obra, fala rápido.","cen":"I’m in the middle of a job, talk fast.","coach":"Respect the time. One question, or two-choice reschedule.","m":["Sem problema, vou ser rápido.","Sem problema, vou ser rápido. Quem cuida da folha de pagamento hoje?","Sem problema! Uma pergunta só: como vocês acompanham as horas dos funcionários em cada obra hoje? Se fizer sentido, eu te ligo num horário melhor."],"w":["ack","open"],"u":[],"badge":""},{"n":3,"c":"Já tenho alguém que faz isso.","cen":"I already have someone who does that.","coach":"Acknowledge, then find out who and what they would change.","m":["Entendi. Quem cuida da folha hoje?","Que bom! É um contador ou outra empresa?","Ótimo, isso é bom de ouvir. O que você mais gosta no serviço, e se pudesse mudar uma coisa, o que seria?"],"w":["ack","open"],"u":[],"badge":""},{"n":4,"c":"Quanto custa?","cen":"How much does it cost? (too early)","coach":"Don’t quote a number yet. Promise a straight answer and earn two questions.","m":["O valor depende do número de funcionários.","Boa pergunta. O valor depende do pacote e do número de funcionários. Quantos funcionários vocês têm hoje?","Eu te passo o valor certinho. Pra isso, posso te fazer duas perguntas rápidas? Quantos funcionários vocês têm e como vocês fazem a folha hoje?"],"w":["ack","open","honest"],"u":[],"badge":"VERIFY"},{"n":5,"c":"Temos só cinco funcionários.","cen":"We only have five employees.","coach":"Small is normal. Move to time spent.","m":["Muitos dos nossos clientes têm poucos funcionários.","Perfeito. Muitos dos nossos clientes começam bem pequenos. Quanto tempo você gasta com a folha hoje?","Justamente por ser pequeno, cada hora conta. Quem faz a folha desses cinco hoje, é você mesmo?"],"w":["ack","open"],"u":[],"badge":""},{"n":6,"c":"Faz tudo no papel mesmo.","cen":"I do everything on paper anyway.","coach":"No judgment. Ask about time and errors.","m":["Entendi. Quanto tempo isso leva por semana?","Entendi. E quanto tempo você gasta com isso por semana?","Faz sentido, muita gente começa assim. Já aconteceu algum erro ou atraso por causa do papel?"],"w":["ack","open"],"u":[],"badge":""},{"n":7,"c":"Pago em dinheiro pra alguns.","cen":"I pay some of them in cash.","coach":"Compliance topic. No legal advice: route to the accountant and move on.","m":["Entendi. Essa parte tem regras específicas.","Entendi. Essa parte tem regras específicas, então o ideal é confirmar com o seu contador.","Entendi, obrigado por me contar. Essa parte tem regras específicas, então o ideal é confirmar com o seu contador ou advogado. O que eu posso fazer é te mostrar como a folha fica organizada no sistema. Quantos funcionários vocês têm no total?"],"w":["ack","honest"],"u":[],"badge":"VERIFY"},{"n":8,"c":"Tenho 18 funcionários e vários 1099.","cen":"I have 18 employees and several 1099s.","coach":"Repeat the number back, then dig into the 1099s and pay frequency.","m":["Entendi. Quantos contratados 1099 vocês têm?","Entendi, dezoito funcionários. E quantos contratados 1099 vocês têm?","Entendi: dezoito W-2 e vários 1099. Com que frequência vocês pagam, e quem cuida disso hoje?"],"w":["ack","open","use"],"u":["dezoito","18","1099"],"badge":""},{"n":9,"c":"A folha leva quase um dia pra mim.","cen":"Payroll takes me almost a whole day.","coach":"That is the pain. Acknowledge it, then ask what takes the longest.","m":["Entendi. É muito tempo.","Nossa, quase um dia. O que é mais trabalhoso nesse processo?","Quase um dia inteiro, entendi. É justamente aí que a gente pode ajudar. O que toma mais tempo: as horas, os cálculos ou os impostos?"],"w":["ack","open","use"],"u":["dia"],"badge":""},{"n":10,"c":"Os funcionários sempre me pedem comprovante.","cen":"Employees are always asking me for proof of income.","coach":"Employee self-service is native. State it plainly and ask how often.","m":["Os funcionários podem acessar os contracheques pelo portal.","Entendi. Na RUN, os funcionários acessam os próprios contracheques pelo portal, sem precisar te pedir.","Entendi. Quantas vezes por mês alguém te pede isso? Na RUN, eles acessam os próprios contracheques e documentos de imposto pelo portal."],"w":["ack"],"u":[],"badge":"NATIVE"},{"n":11,"c":"A rotatividade aqui é altíssima.","cen":"Turnover here is extremely high.","coach":"Restaurant pain. Ask how new people are registered before pitching.","m":["Entendi. Como vocês contratam hoje?","Imagino. Como vocês registram quem entra novo hoje?","Imagino, restaurante é assim mesmo. Se o novo funcionário preenchesse a papelada online, isso ajudaria com a rotatividade?"],"w":["ack","open"],"u":[],"badge":"PACKAGE"},{"n":12,"c":"Controlo as horas numa planilha.","cen":"I track hours in a spreadsheet.","coach":"Ask about time and errors. Time tracking is an add-on.","m":["Entendi. Quanto tempo isso leva?","Entendi. E quanto tempo você leva pra passar as horas da planilha pra folha?","Entendi. Já aconteceu algum erro passando as horas da planilha pra folha? Existe um módulo adicional de controle de horas que se conecta com a folha."],"w":["ack","open","use"],"u":["planilha","horas"],"badge":"PACKAGE"},{"n":13,"c":"Preciso saber quanto cada obra custa.","cen":"I need to know how much each job costs.","coach":"Job Costing depends on the package. Ask how they track it today.","m":["Entendi. Como vocês acompanham isso hoje?","Faz sentido. Como vocês acompanham o custo de mão de obra em cada obra hoje?","É justamente aí que o controle de custos por projeto pode ajudar. Os funcionários trabalham em mais de uma obra na mesma semana?"],"w":["ack","open","use"],"u":["obra"],"badge":"PACKAGE"},{"n":14,"c":"Isso funciona com QuickBooks?","cen":"Does this work with QuickBooks?","coach":"Verify and answer honestly. Never promise an exact integration.","m":["Deixa eu confirmar esse detalhe.","Dá pra enviar os dados da folha pra programas de contabilidade compatíveis. Deixa eu confirmar a integração exata com o QuickBooks.","Boa pergunta. Existe envio dos dados da folha pra programas compatíveis, mas deixa eu confirmar esse detalhe pra te passar a informação certa. Qual versão do QuickBooks vocês usam?"],"w":["honest"],"u":[],"badge":"VERIFY"},{"n":15,"c":"Você tem aplicativo?","cen":"Do you have an app?","coach":"Yes, but confirm what each user type can do.","m":["Tem aplicativo, sim.","Tem, sim. Existe aplicativo pra acompanhar e fazer tarefas básicas pelo celular.","Tem, sim. Você precisa acessar a folha quando está fora do escritório? Eu confirmo exatamente o que dá pra fazer pelo celular no seu caso."],"w":["honest"],"u":[],"badge":"VERIFY"},{"n":16,"c":"O job costing já vem incluso?","cen":"Is job costing already included?","coach":"Accuracy test: it depends on the package, and deeper detail is a partner integration.","m":["Isso depende do pacote que você escolher.","Isso depende do pacote que você escolher. Deixa eu confirmar exatamente o que está incluído.","Depende do pacote. E pra um nível maior de detalhe, existem soluções de parceiros, que não são nativas da RUN. Que tipo de relatório por obra você precisa?"],"w":["honest"],"u":[],"badge":"PACKAGE"},{"n":17,"c":"Meu contador não gosta de mudar.","cen":"My accountant doesn’t like change.","coach":"Bring the accountant in. Never go around him.","m":["Entendo. A gente trabalha com contadores.","Entendo, é normal. A gente adora trabalhar com contadores. Ele usa algum sistema específico?","Entendo. Que tal a gente marcar uma conversa rapidinha com ele? Muitos contadores gostam de ter tudo num só lugar."],"w":["ack","open"],"u":[],"badge":""},{"n":18,"c":"Vou perder meu cliente pra vocês?","cen":"Am I going to lose my client to you? (accountant)","coach":"Acknowledge the fear, then flip it: closer to the client.","m":["Não. O relacionamento continua sendo seu.","Entendo a preocupação, é super comum. O relacionamento continua sendo seu.","Entendo a preocupação. A ideia é justamente o contrário: você fica mais próximo do cliente, porque tem acesso aos dados e consegue ajudar mais rápido. Quer ver com um cliente seu como exemplo?"],"w":["ack"],"u":[],"badge":"VERIFY"},{"n":19,"c":"Quantos clientes de contabilidade vocês têm?","cen":"How many accounting clients do you have?","coach":"Don’t invent a statistic. Confirm, then turn it into a question.","m":["Deixa eu confirmar esse número.","Boa pergunta. Eu não quero te passar um número errado, deixa eu confirmar.","Deixa eu confirmar esse número pra te passar a informação certa. Enquanto isso, me conta: quantos clientes com funcionários o escritório atende hoje?"],"w":["honest","open"],"u":[],"badge":"VERIFY"},{"n":20,"c":"Qual a diferença de vocês pra outra empresa?","cen":"What’s the difference between you and another company?","coach":"Don’t feature-dump. Ask what matters, then show only that.","m":["A gente ajuda a simplificar a folha.","Boa pergunta. Pra eu responder direito, o que é mais importante pra você: atendimento, tempo ou relatórios?","Depende do que importa pra você. O que você mais gosta na empresa atual, e o que você mudaria? Aí eu te mostro só o que faz diferença."],"w":["ack","open"],"u":[],"badge":""},{"n":21,"c":"Achei seu preço alto.","cen":"I thought your price was high.","coach":"Acknowledge, then ask compared to what. No discount yet.","m":["Entendo. Alto comparado com o quê?","Entendo. Caro comparado com o quê? Quanto vocês pagam hoje?","Entendo. O valor reflete o que está incluído: o suporte, os impostos e a tranquilidade. Além do preço, o que mais é importante pra você nessa decisão?"],"w":["ack","open"],"u":[],"badge":""},{"n":22,"c":"Consegue melhorar o valor?","cen":"Can you improve the price?","coach":"Trade, don’t give. Diagnose before any discount.","m":["Deixa eu ver que flexibilidade eu tenho.","Antes de falar em desconto, deixa eu entender o que é mais importante pra você.","Deixa eu ver que flexibilidade eu tenho. Se eu conseguir melhorar o valor, a gente consegue fechar hoje?"],"w":["honest"],"u":[],"badge":"VERIFY"},{"n":23,"c":"Você tem desconto?","cen":"Do you have a discount?","coach":"Never discount first. Offers must be confirmed.","m":["Deixa eu confirmar que condição eu tenho.","Antes de falar em desconto, deixa eu entender o que é mais importante pra você.","Pode ser que eu tenha uma condição especial, deixa eu confirmar. Se eu conseguir chegar num valor que faça sentido, você se sente confortável em seguir em frente?"],"w":["honest"],"u":[],"badge":"VERIFY"},{"n":24,"c":"Preciso falar com minha esposa, ela cuida do financeiro.","cen":"I need to talk to my wife, she handles the finances.","coach":"Include the decision-maker. Offer a three-way call with two time choices.","m":["Faz sentido. Ela está disponível?","Faz sentido. A gente pode fazer uma chamada rápida os três juntos?","Claro. O que você acha que ela vai querer saber? Que tal marcar amanhã com vocês dois, assim eu respondo as dúvidas dela na hora?"],"w":["ack","next"],"u":[],"badge":""},{"n":25,"c":"E se eu quiser cancelar?","cen":"What if I want to cancel?","coach":"Contract terms are VERIFY. Find the real worry, then confirm.","m":["Deixa eu confirmar os termos do contrato.","Boa pergunta. Deixa eu confirmar os termos exatos pra te passar a informação certa.","Entendo a preocupação. O que exatamente te preocupa: o prazo ou o cancelamento? Eu confirmo os termos e te mostro antes, sem compromisso nenhum."],"w":["ack","honest"],"u":[],"badge":"VERIFY"},{"n":26,"c":"Quanto tempo leva pra começar?","cen":"How long does it take to get started?","coach":"Timelines are VERIFY. Give the setup step you control and book it.","m":["Deixa eu confirmar o prazo.","O cadastro leva uns quinze a vinte minutos. O prazo da primeira folha eu confirmo com você.","O próximo passo é eu coletar umas informações da empresa, leva uns quinze minutos. Eu confirmo o prazo certinho com a implementação. Que dia fica melhor: quarta ou quinta?"],"w":["honest","next"],"u":[],"badge":"VERIFY"},{"n":27,"c":"Gostei, mas não é o momento.","cen":"I liked it, but now isn’t the time.","coach":"Find the real obstacle and keep a dated next step.","m":["Entendo. Quando seria um bom momento?","Entendo. O que faria ser o momento certo?","Entendo, sem pressa. O que impediria a gente de começar hoje? Se for só o momento, posso te ligar na semana que vem pra gente finalizar?"],"w":["ack","open","next"],"u":[],"badge":""},{"n":28,"c":"Me manda por mensagem de texto.","cen":"Send it to me by text.","coach":"Say yes, earn two questions, and book the follow-up.","m":["Claro, mando agora.","Claro! Esse número é o melhor pra falar com você?","Mando hoje. Pra eu mandar o que realmente interessa, posso fazer duas perguntas rápidas? E já deixo uma conversa de dez minutos marcada, pode ser quinta?"],"w":["ack","next"],"u":[],"badge":""},{"n":29,"c":"Posso confiar em vocês pra imposto?","cen":"Can I trust you with taxes?","coach":"No overpromising. Reduce the risk, never eliminate it.","m":["A gente ajuda a reduzir o risco de erro.","O sistema calcula e desconta os impostos da folha, e a gente ajuda a reduzir o risco de erro.","Os impostos da folha são calculados e descontados pelo sistema, e os pagamentos e as declarações são feitos conforme o serviço contratado. A gente ajuda a reduzir o risco de erro. Quem cuida dos impostos da folha hoje?"],"w":["honest"],"u":[],"badge":"NATIVE"},{"n":30,"c":"Ok, vamos fazer.","cen":"OK, let’s do it.","coach":"Stop selling. Congratulate and start onboarding.","m":["Ótimo, então vamos começar.","Parabéns pela decisão! O próximo passo é eu coletar umas informações da empresa.","Parabéns pela decisão! Agora vou precisar de algumas informações pra configurar tudo, leva uns quinze a vinte minutos. Você tem o número do EIN?"],"w":["ack","next"],"u":[],"badge":""}],"rpExample":{"c":"Meu contador cuida da folha.","likely":"Ok, mas você gosta dele?","why":"abrupt, a bit pushy","m":["Entendi. E você tem acesso aos relatórios?","Que bom! Vocês trabalham juntos há muito tempo?","Perfeito. E se o seu contador tivesse tudo num só lugar, você acha que ajudaria?"]},"scenarios":[{"id":"s1","unit":8,"title":"Construction company, 18 employees","brief":"Marcos runs a construction company: 18 W-2 employees, several 1099s, four jobs running, labor tracked on paper. Run the full call: opener, discovery, Job Costing (accurately), pricing, next step.","who":"Marcos, dono de construtora","start":"a","nodes":{"a":{"c":["Alô, Marcos falando.","Hello, Marcos speaking."],"st":"opener","w":["next"],"co":"Name, company, honest reason, then ask for two minutes.","m":["Oi, Marcos. Aqui é o Kyle, da ADP. Você tem dois minutinhos?","Oi, Marcos, tudo bem? Aqui é o Kyle, da ADP. Eu liguei meio de surpresa, então vou ser rápido. Você tem dois minutinhos?","Oi, Marcos, tudo bem? Aqui é o Kyle, da ADP. Eu liguei meio de surpresa, então vou ser rápido: eu trabalho com empresas aqui na região pra simplificar a folha de pagamento e reduzir o trabalho manual. Você tem dois minutinhos pra eu te fazer umas perguntas?"],"i":[["intro",["kyle","adp","minutinhos","perguntas","rapido"],"b"]],"fb":"Desculpa, quem tá falando? De onde?","nx":"b","id":"a"},"b":{"c":["Tô na obra agora, mas fala. O que é?","I’m on the job site right now, but go ahead. What is it?"],"st":"opener","w":["ack","open"],"u":["obra"],"co":"Respect that he is busy. One short reason, then your first discovery question.","m":["Vou ser rápido. Quantos funcionários vocês têm hoje?","Sem problema, vou ser rápido. Quantos funcionários vocês têm hoje?","Sem problema, eu sei que na obra é corrido. Eu trabalho com construtoras pra simplificar a folha. Quantos funcionários vocês têm hoje?"],"i":[["count",["quantos funcionarios","funcionarios","quem cuida","folha"],"c"]],"t":[["price_early",["preco","desconto","promocao","oferta","mais barato"],"bx"]],"fb":"Tá, mas o que você quer saber?","nx":"c","id":"b"},"bx":{"c":["Calma, eu nem sei direito o que você faz. Fala primeiro o que é.","Hold on, I don’t even really know what you do. First tell me what this is."],"st":"opener","w":["ack","open"],"co":"You jumped to price or an offer before any discovery. Reset: acknowledge, one-line reason, one question.","m":["Desculpa. Eu trabalho com folha de pagamento. Quantos funcionários vocês têm?","Tem razão, desculpa. Eu trabalho com empresas pra simplificar a folha de pagamento. Quantos funcionários vocês têm hoje?","Tem razão, deixa eu começar direito. A gente ajuda construtoras a simplificar a folha e reduzir o trabalho manual. Pra ver se faz sentido, quantos funcionários vocês têm hoje?"],"fb":"E aí?","nx":"c","id":"bx"},"c":{"c":["Tenho dezoito funcionários, e uns contratados também.","I have eighteen employees, and some contractors too."],"st":"discovery","w":["ack","open","use"],"u":["dezoito","18","contratados","1099"],"co":"Repeat his number back. Then ask about the contractors or who handles payroll.","m":["Entendi. Quantos contratados vocês têm?","Entendi, dezoito funcionários. Todos são W-2, e quantos contratados 1099 vocês têm?","Entendi: dezoito funcionários e alguns contratados. Os dezoito são todos W-2? E quantos contratados 1099 vocês têm?"],"i":[["contractors",["1099","contratados","w 2","w2"],"d"],["who",["quem cuida","quem faz  mostrar.","A gente pode te mostrar.",3,"a gente pode, not nós podemos."],["É justamente aí que nós podemos ajudar.","É justamente aí que a gente pode ajudar.",3,"a gente pode ajudar."],["Nós ajudamos a reduzir erros.","A gente ajuda a reduzir erros.",3,"a gente ajuda."],["Se eu consigo chegar num valor que faz sentido, você avança?","Se eu conseguir chegar num valor que faça sentido, você avança?",4,"se eu conseguir (future subjunctive) ... que faça (present subjunctive)."],["Se isso resolve, faz sentido a gente começar?","Se isso resolver, faz sentido a gente começar?",4,"se + future subjunctive: se isso resolver."],["Se eu resolvo o valor, a gente fecha hoje?","Se eu resolver o valor, a gente fecha hoje?",4,"se eu resolver."],["Se você pode mudar uma coisa, o que seria?","Se você pudesse mudar uma coisa, o que seria?",4,"Hypothetical: se você pudesse ... o que seria."],["Quer que eu mostro alguma coisa?","Quer que eu mostre alguma coisa?",4,"querer que + subjunctive: que eu mostre."],["A gente suporta os clientes.","A gente dá suporte aos clientes.",5,"suportar = to endure. Support is dar suporte a / apoiar."],["Atualmente, é uma integração de parceiro.","Na verdade, é uma integração de parceiro.",5,"“Actually” = na verdade. Atualmente = currently."],["Quantos contratadores 1099 vocês têm?","Quantos contratados 1099 vocês têm?",5,"contratador = the one who hires. Contractor = contratado."],["Eu sou ocupado agora.","Eu estou ocupado agora.",6,"Temporary state: estar."],["Estou bom, obrigado.","Estou bem, obrigado.",6,"estou bem. Estar bom is about food or health."],["Você é satisfeito com o atendimento?","Você está satisfeito com o atendimento?",6,"Satisfaction is a state: está satisfeito."],["Vocês são contratando?","Vocês estão contratando?",6,"Ongoing action: estar + -ndo."],["Eles fazem muito tempo extra?","Eles fazem muita hora extra?",7,"Overtime = hora extra."],["O pagamento sai por depósito direito.","O pagamento sai por depósito direto.",7,"Direct deposit = depósito direto."],["Os funcionários trabalham em mais de um sítio na mesma semana?","Os funcionários trabalham em mais de uma obra na mesma semana?",7,"Job site in construction = a obra."],["Os funcionários acessam os próprios talões pelo portal.","Os funcionários acessam os próprios contracheques pelo portal.",7,"Pay stub = contracheque (or holerite)."]],"patterns":{"frames":{"t":"Six frames, swap the noun","ex":[["Como vocês fazem a folha hoje?","How do you handle payroll today?"],["Como vocês fazem o controle de horas hoje?","How do you handle time tracking today?"],["Quem cuida da folha?","Who takes care of payroll?"],["Quem cuida dos impostos?","Who takes care of taxes?"]],"q":"What changes between the first two questions?","o":["Only the noun in the [X] slot","The verb form","The word order"],"a":0,"rule":"Six frames run a whole discovery. Keep the frame fixed and swap the noun: Como vocês fazem [X] hoje? · Quem cuida de [X]? · Quantos [X] vocês têm? · Com que frequência [X]? · Quanto tempo vocês gastam com [X]? · O que mais incomoda vocês em [X]?"},"agente":{"t":"A gente = we, with the easy verb form","ex":[["Você ajuda.","You help."],["Ele ajuda.","He helps."],["A gente ajuda.","We help."]],"q":"Which verb form does a gente take?","o":["The same as você / ele","The nós form (ajudamos)","The eu form (ajudo)"],"a":0,"rule":"A gente means “we” and is the spoken default. It takes the você / ele form: a gente ajuda, a gente pode, a gente vai. Nós ajudamos is correct but sounds like a textbook."},"estar":{"t":"Estar for how things are right now","ex":[["Estou ocupado.","I’m busy (right now)."],["Você está satisfeito?","Are you satisfied?"],["Vocês estão contratando?","Are you hiring?"]],"q":"Busy, satisfied, hiring: what do they share?","o":["They are temporary states, so they use estar","They are permanent traits, so they use ser","They are all past tense"],"a":0,"rule":"Temporary states and ongoing actions use estar: estou ocupado, está satisfeito, estão contratando. Ser is for identity: você é o dono. Never “sou ocupado”."},"voces":{"t":"Você vs vocês","ex":[["Como você faz a folha?","How do you (one person) do payroll?"],["Como vocês fazem a folha?","How do you (the company) do payroll?"]],"q":"Which sounds warmer and less accusatory to an owner?","o":["Como vocês fazem...","Como você faz...","They sound the same"],"a":0,"rule":"Você is one person. Vocês is the team. In a company, vocês is warmer: Como vocês fazem... beats Como você faz... Use o senhor / a senhora only with an older owner who clearly prefers it."},"future":{"t":"Future without conjugating","ex":[["Eu vou mostrar.","I’m going to show."],["Vocês vão economizar.","You’re going to save."],["A gente vai começar.","We’re going to start."]],"q":"How is the future built here?","o":["ir (vou / vai / vão) + infinitive","A special future ending on the verb","The word “será” before the verb"],"a":0,"rule":"Don’t conjugate the future. Use ir + infinitive: eu vou, você / a gente vai, vocês vão + mostrar, fazer, começar."},"conditional":{"t":"The polite -ia","ex":[["Eu poderia te mostrar.","I could show you."],["Seria útil.","It would be useful."],["Isso ajudaria?","Would that help?"]],"q":"What ending makes these polite “would / could” forms?","o":["-ia added to the infinitive","-ando added to the stem","-ou added to the stem"],"a":0,"rule":"Conditional = infinitive + -ia: poderia, ajudaria, precisaria (irregular: faria, seria). It softens everything. In speech, queria is the polite “I would like”."},"soundalike":{"t":"One letter, different meaning","ex":[["folha","payroll"],["falha","failure"],["empresa","company"],["impressa","printed"]],"q":"A prospect hears “Quem cuida da falha?” What did you just ask?","o":["Who takes care of the failure?","Who takes care of payroll?","Who takes care of the company?"],"a":0,"rule":"folha (payroll) vs falha (failure). empresa (company) vs impressa (printed). Say and spell them slowly until they are automatic: FO-lya, em-PRE-za."},"numbers":{"t":"Joining numbers with e","ex":[["23","vinte e três"],["145","cento e quarenta e cinco"],["100","cem"],["3.000","três mil"]],"q":"How do you say 120?","o":["cento e vinte","cem e vinte","cem vinte"],"a":0,"rule":"Tens and ones join with e (vinte e três). Hundreds join with e (cento e quarenta e cinco). Cem is only exactly 100; from 101 on it is cento e... Thousands: três mil."},"falsefriends":{"t":"False friends","ex":[["atualmente","currently"],["na verdade","actually"],["pretender","to intend"],["suportar","to endure"]],"q":"How do you say “we support our clients”?","o":["A gente dá suporte aos clientes.","A gente suporta os clientes.","A gente pretende os clientes."],"a":0,"rule":"suportar = endure (use apoiar / dar suporte a). atualmente = currently (actually = na verdade). pretender = intend (pretend = fingir). aplicar = administer or invest (apply for a job = candidatar-se). contratador = the one who hires (contractor = contratado)."},"native":{"t":"Native, package, partner, verify","ex":[["Os impostos são calculados pelo sistema.","NATIVE: safe to state."],["Isso depende do pacote.","PACKAGE: Job Costing tier, HR tools, time add-on."],["É uma integração de parceiro.","PARTNER: advanced job costing, certified payroll."],["Deixa eu confirmar.","VERIFY: pricing, contract, timelines."]],"q":"A builder asks for certified payroll. What do you say?","o":["É uma integração de parceiro, não é nativo da RUN.","A RUN faz isso em qualquer pacote.","Isso já vem incluso."],"a":0,"rule":"Never invent a capability. Payroll core is native. Job Costing and HR tools depend on the package; Time and Attendance is an add-on. Detailed job / phase / cost-code reporting and certified payroll are partner integrations with a separate cost. Anything about price, contract or timing: deixa eu confirmar."},"ajudar":{"t":"Ajudar a + infinitive","ex":[["A gente ajuda vocês a simplificar a folha.","We help you simplify payroll."],["Isso ajuda a entender.","That helps you understand."],["Me ajuda a entender.","Help me understand."]],"q":"What small word always comes between ajudar and the next verb?","o":["a","de","para"],"a":0,"rule":"ajudar + a + infinitive, and keep the articles: a gente ajuda as empresas a reduzir erros. English drops these little words; Portuguese does not."},"invest":{"t":"Investimento vs custo","ex":[["Quanto vocês pagam hoje?","their current spend = custo"],["O investimento é maior que o que você paga hoje.","your price = investimento"]],"q":"Which word do you use for your own price?","o":["investimento","custo","caro"],"a":0,"rule":"Say investimento when presenting your price and custo when talking about their current spend. Never say “isso é caro” about your own product: O valor reflete o que está incluído."},"subjunctive":{"t":"Se eu conseguir... que faça sentido","ex":[["Se eu conseguir melhorar o valor...","If I can improve the price..."],["Se isso resolver...","If this solves it..."],["...um valor que faça sentido","...a price that makes sense"]],"q":"After se, for something that may happen, which form is right?","o":["se eu conseguir","se eu consigo","se eu conseguia"],"a":0,"rule":"After se (if) about the future, use the future subjunctive, which for regular verbs looks like the infinitive: se eu conseguir, se isso resolver, se a gente começar. After que expressing a wish or condition: que faça sentido, quer que eu mostre."},"objection":{"t":"The universal objection pattern","ex":[["Entendo.","1. Acknowledge"],["Caro comparado com o quê?","2. Ask"],["(ouve)","3. Listen"],["Deixa eu te mostrar o que está incluído.","4. Respond"],["Quarta ou quinta?","5. Next step"]],"q":"The customer says “É muito caro.” What comes first?","o":["Acknowledge, then ask a question","Offer a discount","Explain why they are wrong"],"a":0,"rule":"Entendo → pergunta → ouve → resposta → próximo passo. Never argue first, and never jump to price, challenge or discount before you acknowledge and diagnose."}},"cheat":{"questions":["Q  t('Content: lessons reference real items, units have 4 to 8 lessons',C.units.every(u=>u.lessons.length>=4&&u.lessons.length<=8&&u.lessons.every(l=>l.items.every(id=>IT[id]))));t('Content: bosses and pre-meeting resolve',C.units.every(u=>u.boss&&bossScenario(u).nodes.n0)&&C.premeeting.every(p=>p.phrases.every(id=>IT[id])));
 t('Lessons: every lesson composes 8 to 14 exercises',Object.values(LES).every(l=>{const n=buildLesson(l).length;return n>=8&&n<=14}));
 try{console.log('Self-tests: '+(out.length-fail)+' passed, '+fail+' failed')}catch(e){}window.__tests={pass:out.length-fail,fail,out};
 if(show)modal('<h2>Self-tests: '+(out.length-fail)+' passed, '+fail+' failed</h2>'+out.map(o=>'<div class="sm" style="color:var(--'+(o[0]?'ok':'bad')+')">'+(o[0]?'PASS ':'FAIL ')+esc(o[1])+'</div>').join('')+'<button class="btn block mt2" data-a="modal-close">Close</button>');return fail===0}
window.runSelfTests=runSelfTests;

/* ---------- init ---------- */
load();indexItems();applyTheme();TTS.init();applyFreezes();render();if(!S.onboarded)onboarding();
if(/[?&]test=1/.test(location.search))setTimeout(()=>runSelfTests(true),50);
})();
